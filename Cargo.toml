[package]
name = "arrabbiata"
version = "0.2.0"
authors = ["WenniDev"]
license = "MIT"
readme = "README.md"
edition = "2024"
build = "build.rs"

# Forked from https://github.com/adamaq01/mikado by Adam Thibert, which targets
# SOUND VOLTEX. The AVS property layer (src/sys.rs) and the logger are reused as-is;
# everything game-specific is rewritten for DanceDanceRevolution GRAND PRIX.

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build"] }

[dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
crochet = "0.2"
log = "0.4"
env_logger = "0.11"
anstyle = "1"
anstream = "1"
panic-log = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
confy = "2"
anyhow = "1"
chrono = "0.4"
ureq = { version = "3.4", features = ["json"] }
url = "2.3"
